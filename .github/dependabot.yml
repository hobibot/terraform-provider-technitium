version: 2

updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: daily
      time: "06:00"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - go

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
      time: "06:15"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - github-actions
